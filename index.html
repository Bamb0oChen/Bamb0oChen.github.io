<!DOCTYPE html>
<html lang="zh">

<head>

    <meta http-equiv="Cache-Control" content="no-store" />

    <link rel="stylesheet" href="static/header.css">
    <link rel="stylesheet" href="static/hero.css">
    <link rel="stylesheet" href="static/styles.css">
    <link rel="icon" href="favicon.ico" />
</head>

<body>

    <canvas id="starfield" class="starfield-canvas" aria-hidden="true"></canvas>

    <header id="header">
        <div style="display:flex; align-items:center; gap:12px; width:100%; max-width:1100px; justify-content:space-between;">
            <div style="font-weight:bold; font-size:18px;">Chen.のhomepage</div>

                <a href="focus.html" class="nav-btn">专注计时器</a>
                <a href="gallery.html" class="nav-btn">光影留痕</a>

            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1 class="greeting">✨欢迎来到Chen.のhomepage🧤</h1>
            <div class="typed-wrapper">
                <span id="typed" class="typed-text"></span>
                <span class="cursor" aria-hidden="true"></span>

        </div>

    <!-- 精选光影留痕 - 横向滚动 -->

        <h2 style="color:white; text-align:center; margin-top:30px;">精选光影</h2>

    </div>

    <!-- 妙笔生花 - 精选文章 -->

        <h2 style="color:white; text-align:center; margin-top:30px;">妙笔生花</h2>
        <div id="articlesContainer" class="articles-grid"></div>
    </div>

    <!-- 专心做视频 - 本地视频卡片 -->
    <div class="content">
        <h2 style="color:white; text-align:center; margin-top:30px;">专心做视频</h2>
        <div id="focusVideosContainer" class="articles-grid"></div>
    </div>

    <!-- 更新频率统计 -->
    <div class="content">
        <h2 style="color:white; text-align:center; margin-top:30px;">更新频率统计</h2>
        <div id="heatmapContainer" class="heatmap"></div>
        <div class="heat-legend">
            <span>少</span>
            <div class="legend-blocks">
                <div class="legend-cell level-0"></div>
                <div class="legend-cell level-1"></div>
                <div class="legend-cell level-2"></div>
                <div class="legend-cell level-3"></div>
                <div class="legend-cell level-4"></div>
            </div>
            <span>多</span>
        </div>
    </div>

    <!-- 更新日志 - 时间线 -->
    <div class="content">
        <h2 style="color:white; text-align:center; margin-top:30px;">更新日志</h2>
        <div id="changelog-container" class="changelog-timeline"></div>
    </div>

    <script src="static/data.js"></script>
    <script>
        // 精选光影照片数据 - 优先读取本地图片库配置，否则回退到 localStorage
        function getFeaturedPhotos(limit) {
            const maxCount = limit || 10;
            const featured = Array.isArray(window.FEATURED_LIGHTTRACE) ? window.FEATURED_LIGHTTRACE : [];
            if (featured.length > 0) {
                return featured.slice(0, maxCount).map(item => ({
                    data: item.src,
                    comment: item.comment || '',
                    fileName: item.id || item.src || ''
                }));
            }

            try {
                const stored = localStorage.getItem('gallery_images_v1');
                const images = stored ? JSON.parse(stored) : [];
                return images.slice(0, maxCount); // 自动计算显示数量
            } catch (e) {
                return [];
            }
        }

        function getFeaturedPhotoLimit() {
            const container = document.getElementById('featuredPhotosContainer');
            if (!container) return 12;
            const width = container.clientWidth;
            if (!width) return 12;
            // 手机端显示4张（2行2列）
            if (width < 768) {
                return 4;
            }
            const itemSize = 160;
            const gap = 12;
            const padding = 32;
            const usable = Math.max(0, width - padding);
            const columns = Math.max(1, Math.floor((usable + gap) / (itemSize + gap)));
            return Math.max(12, columns * 2);
        }

        // 渲染精选光影
        function renderFeaturedPhotos() {
            const container = document.getElementById('featuredPhotosContainer');
            const limit = getFeaturedPhotoLimit();
            const photos = getFeaturedPhotos(limit);

            if (photos.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:40px;">暂无光影留痕，<a href="gallery.html" style="color:#ffa500;">去上传</a></div>';
                return;
            }

            container.innerHTML = '';
            const scroll = document.createElement('div');
            scroll.className = 'photos-scroll-wrapper';

            photos.forEach(photo => {
                const item = document.createElement('div');
                item.className = 'photo-item';
                item.innerHTML = `
                    <img src="${photo.data}" alt="" title="${photo.fileName || ''}">
                    <div class="photo-comment">${photo.comment || ''}</div>
                `;
                item.addEventListener('click', () => {
                    window.location.href = 'gallery.html';
                });
                scroll.appendChild(item);
            });

            container.appendChild(scroll);
        }

        let featuredResizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(featuredResizeTimer);
            featuredResizeTimer = setTimeout(renderFeaturedPhotos, 150);
        });

        // 妙笔生花 - 精选文章数据
        // 数据字段说明:
        // - id: 文章ID
        // - title: 文章标题
        // - description: 文章简述
        // - image: 卡片显示的图片URL（缩略图）
        // - link: 点击卡片后跳转的链接URL
        // - comment: 评注/标签
        const articles = [{
            id: 1,
            title: "python进阶讲义",
            description: "基于Geminishen'cheng的一份py进阶讲义，主要针对CS61A的学习者",
            image: "photos/photo1.webp",
            link: "https://yanzhuchen0901.github.io/notes/#/computer-science/UCB%20CS61A/python",
            comment: "学习天地"
        }, {
            id: 2,
            title: "我们为什么要去游乐园",
            description: "记录于高中去游乐园后的返程",
            image: "photos/photo2.png",
            link: "https://yanzhuchen0901.github.io/notes/#/Diary/amusementpark",
            comment: "感性空间"
        }, {
            id: 3,
            title: "CET-6正课笔记",
            description: "记录六级正课的听力、阅读、写作笔记，持续更新中",
            image: "photos/photo3.jpg",
            link: "https://yanzhuchen0901.github.io/notes/#/English/CET-6/translation_and_writing1",
            comment: "学习天地"
        }, {
            id: 4,
            title: "星空列车与白的旅行测评",
            description: "很久没因为一个艺术作品而体会过眼泪决堤了，不过我想这就是一款好的gal该做的，让玩家在有限的时间里，亲身体会一段别人的故事。",
            image: "photos/photo4.png",
            link: "https://yanzhuchen0901.github.io/notes/#/Diary/star_white",
            comment: "感性空间"
        }];

        function getFocusVideos() {
            if (Array.isArray(window.FOCUS_VIDEO_LIBRARY)) {
                return window.FOCUS_VIDEO_LIBRARY.filter(item => item && item.src);
            }
            return [];
        }

        function renderFocusVideos() {
            const container = document.getElementById('focusVideosContainer');
            if (!container) return;

            const videos = getFocusVideos();
            container.innerHTML = '';

            if (videos.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:30px; grid-column:1/-1;">暂无视频，请将文件放入 photos/focus-videos/ 并在 static/data.js 的 FOCUS_VIDEO_LIBRARY 中添加条目。</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'articles-grid';

            videos.forEach(videoItem => {
                const card = document.createElement('div');
                card.className = 'article-card';
                card.style.cursor = 'pointer';
                card.innerHTML = `
                    <div class="article-image">
                        <video src="${videoItem.src}" muted loop playsinline preload="metadata"></video>
                    </div>
                    <div class="article-content">
                        <h3>${videoItem.title || '未命名视频'}</h3>
                        <p>${videoItem.description || '专注记录'}</p>
                        <div class="article-comment">${videoItem.comment || ''}</div>
                    </div>
                `;

                const videoEl = card.querySelector('video');
                if (videoEl) {
                    card.addEventListener('mouseenter', () => {
                        videoEl.currentTime = 0;
                        videoEl.play().catch(() => {});
                    });
                    card.addEventListener('mouseleave', () => {
                        videoEl.pause();
                        videoEl.currentTime = 0;
                    });
                }

                card.addEventListener('click', () => {
                    window.open(videoItem.src, '_blank');
                });

                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        // 更新日志数据
        const changelog = [{
            date: "2026-02-27",
            title: "新增用心做视频板块，并且上传了第一个视频",
            description: "支持视频上传、查看、评注功能，完整的前端实现"
        }, {
            date: "2026-02-13",
            title: "新增光影留痕画廊",
            description: "支持图片上传、查看、评注功能，完整的前端实现"
        }, {
            date: "2026-02-12",
            title: "优化更新频率统计",
            description: "改进热力图展示，提升用户体验"
        }, {
            date: "2026-02-10",
            title: "妙笔生花模块上线",
            description: "精选文章卡片化展示，支持响应式布局"
        }, {
            date: "2026-02-08",
            title: "主页大改版",
            description: "移除标签页功能，重构导航菜单结构"
        }, {
            date: "2026-02-05",
            title: "修复样式兼容性问题",
            description: "改进移动端适配、优化深色主题"
        }];

        // 渲染妙笔生花
        function renderArticles() {
            const container = document.getElementById('articlesContainer');
            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'articles-grid';

            articles.forEach(article => {
                const card = document.createElement('div');
                card.className = 'article-card';
                card.style.cursor = 'pointer';
                card.innerHTML = `
                    <div class="article-image">
                        <img src="${article.image}" alt="${article.title}">
                    </div>
                    <div class="article-content">
                        <h3>${article.title}</h3>
                        <p>${article.description}</p>
                        <div class="article-comment">${article.comment}</div>
                    </div>
                `;
                // 添加点击事件 - 跳转到文章链接
                card.addEventListener('click', () => {
                    window.open(article.link, '_blank');
                });
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        // 渲染更新日志
        function renderChangelog() {
            const container = document.getElementById('changelog-container');
            container.innerHTML = '';
            const timeline = document.createElement('div');
            timeline.className = 'timeline';

            changelog.forEach((log, index) => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerHTML = `
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <div class="timeline-date">${log.date}</div>
                        <div class="timeline-title">${log.title}</div>
                        <div class="timeline-description">${log.description}</div>
                    </div>
                `;
                timeline.appendChild(item);
            });

            container.appendChild(timeline);
        }
    </script>
    <script>
        // 渲染简单的 GitHub 风格热图（最近 52 周）
        async function renderHeatmap() {
            const counts = getHeatmapData();

            const container = document.getElementById('heatmapContainer');
            container.innerHTML = '';
            const today = new Date();
            // 以周为列，52 列，每列 7 天
            const weeks = 52;
            const oneDay = 24 * 60 * 60 * 1000;

            const endDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

            for (let w = weeks - 1; w >= 0; w--) {
                const col = document.createElement('div');
                col.className = 'heat-col';
                for (let d = 6; d >= 0; d--) {
                    const cell = document.createElement('div');
                    cell.className = 'heat-cell level-0';
                    const dayOffset = w * 7 + d;
                    const date = new Date(endDate.getTime() - dayOffset * oneDay);
                    const y = date.getFullYear();
                    const m = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    const key = `${y}-${m}-${day}`;
                    const value = counts[key] || 0;
                    let lvl = 0;
                    if (value >= 4) lvl = 4;
                    else if (value >= 3) lvl = 3;
                    else if (value >= 2) lvl = 2;
                    else if (value >= 1) lvl = 1;
                    cell.className = 'heat-cell level-' + lvl;
                    cell.title = `${key}: ${value}`;
                    col.appendChild(cell);
                }
                container.appendChild(col);
            }
        }

        // 仅在用户滚动后显示热图（与 header 一致的显示逻辑）
        function setupScrollReveal() {
            const heat = document.getElementById('heatmapContainer');
            if (heat) heat.style.opacity = 0;
            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY;
                const windowH = window.innerHeight;
                let opacity = Math.min(1, Math.max(0, (scrollY - windowH / 2) / (windowH / 2)));
                if (heat) heat.style.opacity = opacity;
            });
        }

        renderFeaturedPhotos();

        // 初始化示例数据到热力图（如果localStorage为空）
        (function initSampleHeatmapData() {
            const RECORDS_PREFIX = 'daily_record_';
            let hasData = false;

            // 检查是否已有数据
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(RECORDS_PREFIX)) {
                    hasData = true;
                    break;
                }
            }

            // 如果没有数据，添加示例数据
            if (!hasData) {
                const today = new Date();
                // 添加最近30天的示例数据
                for (let i = 0; i < 30; i++) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    const y = date.getFullYear();
                    const m = String(date.getMonth() + 1).padStart(2, '0');
                    const d = String(date.getDate()).padStart(2, '0');
                    const key = `${RECORDS_PREFIX}${y}-${m}-${d}`;

                    // 随机生成活跃度（0-6）
                    const activity = Math.floor(Math.random() * 6);

                    if (activity > 0) {
                        const sampleData = {
                            date: `${y}-${m}-${d}`,
                            keywords: activity > 2 ? ["更新"] : [],
                            today_done: activity > 1 ? "完成了一些工作" : "",
                            tomorrow_plan: activity > 3 ? ["继续努力"] : [],
                            insights: activity > 3 ? "有所收获" : "",
                            todos: activity > 2 ? ["任务1"] : [],
                            focus_sessions: activity > 1 ? [{
                                duration: 30
                            }] : []
                        };
                        localStorage.setItem(key, JSON.stringify(sampleData));
                    }
                }
            }
        })();

        renderHeatmap();
        setupScrollReveal();
        renderArticles();
        renderFocusVideos();
        renderChangelog();

        // 初始化 header 为隐藏状态
        const header = document.getElementById("header");
        const hero = document.querySelector(".hero");
        if (header) header.style.opacity = 0;

        window.addEventListener("scroll", () => {
            const scrollY = window.scrollY;
            const windowH = window.innerHeight;

            if (hero) {
                let heroOpacity = Math.max(0, 1 - scrollY / windowH);
                hero.style.opacity = heroOpacity;
            }

            if (header) {
                let headerOpacity = Math.min(1, Math.max(0, (scrollY - windowH / 2) / (windowH / 2)));
                header.style.opacity = headerOpacity;
            }
        });
    </script>

    <script>
        // 简单打字机循环效果（移动端友好、无外部依赖）
        (function() {
            const el = document.getElementById('typed');
            if (!el) return;
            const phrases = ["陈彦竹", "Yanzhu Chen🎍", "📖ZJUer", "💻CS Learner", "both conter strike & computer science", "Coffee☕ & Pingpong🏓 Lover", "Billiards experienced🎱"];
            let pi = 0,
                ci = 0,
                deleting = false;
            const typeSpeed = 90,
                deleteSpeed = 50,
                pause = 1200;

            function tick() {
                const full = phrases[pi];
                if (!deleting) {
                    ci++;
                    el.textContent = full.slice(0, ci);
                    if (ci === full.length) {
                        deleting = true;
                        setTimeout(tick, pause);
                        return;
                    }
                } else {
                    ci--;
                    el.textContent = full.slice(0, ci);
                    if (ci === 0) {
                        deleting = false;
                        pi = (pi + 1) % phrases.length;
                    }
                }
                setTimeout(tick, deleting ? deleteSpeed : typeSpeed);
            }

            // start after small delay for nicer entry
            setTimeout(tick, 400);
        })();
    </script>

    <script src="static/particle-config.js"></script>
    <script src="starfield.js"></script>

</body>

</html>
