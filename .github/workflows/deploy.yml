name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - newhead
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Create runtime config
        env:
          AGENT_ENDPOINT: ${{ vars.AGENT_ENDPOINT || secrets.AGENT_ENDPOINT }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || secrets.AGENT_MODEL }}
          QB_ROUTE: ${{ vars.QB_ROUTE || secrets.QB_ROUTE }}
          IMMICH_ROUTE: ${{ vars.IMMICH_ROUTE || secrets.IMMICH_ROUTE }}
          NGINX_ROUTE: ${{ vars.NGINX_ROUTE || secrets.NGINX_ROUTE }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const config = {
            agent: {
              endpoint: process.env.AGENT_ENDPOINT || '',
              headers: {},
              options: {
                model: process.env.AGENT_MODEL || '',
                temperature: 0.4
              }
            },
            services: {
              qb: process.env.QB_ROUTE || '',
              immich: process.env.IMMICH_ROUTE || '',
              nginx: process.env.NGINX_ROUTE || ''
            }
          };

          fs.mkdirSync('public', { recursive: true });
          fs.writeFileSync('public/agent-config.json', `${JSON.stringify(config, null, 2)}\n`);

          console.log('Runtime config generated:', {
            agentEndpoint: Boolean(config.agent.endpoint),
            agentModel: Boolean(config.agent.options.model),
            qbRoute: Boolean(config.services.qb),
            immichRoute: Boolean(config.services.immich),
            nginxRoute: Boolean(config.services.nginx)
          });
          NODE

      - name: Build
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
