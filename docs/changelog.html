<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 - Chen.のhomepage</title>
    <link rel="stylesheet" href="../static/header.css">
    <style>
        :root {
            color-scheme: dark;
            --bg: #020406;
            --text: rgba(255, 255, 255, 0.94);
            --muted: rgba(255, 255, 255, 0.58);
            --line: rgba(255, 255, 255, 0.12);
            --cyan: #5cd5c4;
            --amber: #f4a261;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255, 255, 255, 0.28) 0 1px, transparent 1.4px);
            background-size: 180px 180px, 280px 280px;
            background-position: 28px 36px, 90px 120px;
            opacity: 0.38;
        }

        a {
            color: inherit;
        }

        html.is-page-transitioning::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 5000;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(92, 213, 196, 0.12), transparent 30%),
                rgba(0, 0, 0, 0.28);
            animation: pageTransitionVeil 0.22s ease-out forwards;
        }

        html.is-page-transitioning::after {
            content: "";
            position: fixed;
            top: 82px;
            left: 50%;
            z-index: 5001;
            width: min(360px, calc(100vw - 80px));
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(92, 213, 196, 0.9), rgba(244, 162, 97, 0.8), transparent);
            box-shadow:
                0 0 24px rgba(92, 213, 196, 0.46),
                0 0 42px rgba(244, 162, 97, 0.16);
            transform-origin: top center;
            animation: pageTransitionLine 0.22s cubic-bezier(0.2, 0.75, 0.2, 1) forwards;
        }

        @keyframes pageTransitionVeil {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pageTransitionLine {
            0% {
                opacity: 0;
                transform: translate(-50%, -4px) scaleX(0.35);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, 0) scaleX(1);
            }
        }

        main {
            position: relative;
            z-index: 1;
            width: min(980px, calc(100vw - 36px));
            margin: 0 auto;
            padding: 156px 0 100px;
        }

        .terminal {
            position: relative;
            min-height: min(66vh, 620px);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            background: rgba(5, 11, 15, 0.88);
            box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
            font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
        }

        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 42px;
            padding: 0 17px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.045);
            color: var(--muted);
            font-size: 12px;
        }

        .terminal-dots { display: inline-flex; align-items: center; gap: 8px; }
        .terminal-dots i { display: block; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
        .terminal-dots i:nth-child(1) { background: #ff5f57; }
        .terminal-dots i:nth-child(2) { background: #febc2e; }
        .terminal-dots i:nth-child(3) { background: #28c840; }
        .terminal-title { margin-left: auto; }

        .terminal-body {
            padding: 28px;
            font-size: 14px;
            line-height: 1.75;
        }

        .terminal-line { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .terminal-command { color: #f1f5f3; }
        .terminal-error { color: #efaa9b; }
        .terminal-prompt { color: #92d6bd; user-select: none; }

        .terminal-log {
            margin: 12px 0 28px;
            padding: 0;
            color: rgba(255, 255, 255, 0.76);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: inherit;
        }

        .terminal-input-row {
            display: flex;
            align-items: baseline;
            gap: 9px;
        }

        .terminal-input {
            flex: 1;
            min-width: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            caret-color: #a8e7d6;
            font: inherit;
        }

        .terminal-input::placeholder { color: rgba(255, 255, 255, 0.36); }

        .terminal-overlay {
            position: absolute;
            inset: 42px 0 0;
            display: flex;
            flex-direction: column;
            background: #09131a;
            color: #e8f1ed;
            z-index: 2;
        }

        .nano-header, .nano-footer {
            padding: 8px 16px;
            background: #236174;
            color: #fff;
            font-size: 13px;
        }

        .nano-header span { float: right; }
        .nano-content {
            flex: 1;
            min-height: 360px;
            width: 100%;
            resize: none;
            padding: 18px;
            border: 0;
            outline: 0;
            background: transparent;
            color: inherit;
            font: 13px/1.8 "JetBrains Mono", "Cascadia Code", Consolas, monospace;
        }

        .nano-footer { display: flex; gap: 20px; }
        .nano-footer button {
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .terminal-warning-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, 0.72);
        }

        .terminal-warning {
            display: grid;
            justify-items: center;
            gap: 12px;
            width: min(320px, calc(100vw - 40px));
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 16px;
            background: #101a20;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        }

        .terminal-warning pre { margin: 0; color: #a8e7d6; font-size: 24px; line-height: 1.3; }
        .terminal-warning strong { font-size: 22px; }
        .terminal-warning p { margin: 0; color: rgba(255, 255, 255, 0.68); text-align: center; font-size: 13px; }
        .terminal-warning button {
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            main { padding-top: 132px; }
            .terminal-body { padding: 20px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="header-root"></div>

    <main id="terminal-root"></main>
    <script type="module" src="/src/main-changelog.jsx"></script>
</body>
</html>
